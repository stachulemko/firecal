[project]
name = "firecal"
version = "0.1.0"
description = "Harmonized multi-sensor burning activity calendar and fire activity forecasting (MODIS + VIIRS active fire hotspots)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "requests>=2.31",
    "shapely>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
firecal = "firecal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["firecal*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
